# Database connection (no secrets in this file).
# The MySQL password is NOT stored here: it is read from the DB_PASSWORD environment variable
# (run.ps1 asks for it in the terminal). Optional overrides: DB_USER, DB_URL.
url=jdbc:mysql://localhost:3306/pyplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
user=root

# Windows: python   |  Linux/Mac: python3
python.cmd=python
run.timeout.seconds=5
